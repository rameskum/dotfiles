# Everything the install scripts put on a machine. Nothing else is installed.
#
# macOS, Linux and WSL use Homebrew; Windows uses WinGet.
# WezTerm has no Linux build in Homebrew (its cask needs macOS), so on Linux it
# is installed by hand. On WSL the terminal and font live on the Windows side.
packages:
  formulae:
    - starship
    - fzf
    - zoxide
    - zsh-autosuggestions
    - zsh-syntax-highlighting
    - zsh-history-substring-search
  casks:
    darwin:
      - wezterm
      - font-jetbrains-mono-nerd-font
    linux:
      - font-jetbrains-mono-nerd-font
  winget:
    - wez.wezterm
    - DEVCOM.JetBrainsMonoNerdFont
    - Starship.Starship
    - junegunn.fzf
    - ajeetdsouza.zoxide
